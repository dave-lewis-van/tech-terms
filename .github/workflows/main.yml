name: API Documentation Pipeline

on:
  push:
    branches: [ v1.0 ]
  pull_request:
    branches: [ v1.0 ]
  workflow_dispatch:

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. GENERATION: Use Python to export the spec from FastAPI
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate OpenAPI Spec
        run: |
          python gen_openapi.py

      - name: Check spec is up to date
        run: git diff --exit-code reference/openapi.yaml

      # 2. LINTING: Doc quality checks and OpenAPI spec validation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint doc quality
        run: npx tsx scripts/lint-docs.ts

      - name: Lint OpenAPI Spec
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: 'reference/openapi.yaml'

      # 3. CONTRACT TESTING: Ensuring the Spec and Code haven't drifted
      - name: Run Schemathesis Tests
        run: |
          uvicorn main:app --host 0.0.0.0 --port 3000 &
          schemathesis run ./reference/openapi.yaml --url http://localhost:3000 --wait-for-schema 30 | tee schemathesis-report.txt

      - name: Upload Schemathesis Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: schemathesis-report.txt
